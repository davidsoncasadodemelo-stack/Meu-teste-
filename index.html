<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Catálogo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #222;
    }

    h1 {
      margin: 0;
    }

    .catalogo {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .filme {
      background: #222;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .filme h2 {
      margin-top: 0;
    }

    .botao {
      display: inline-block;
      padding: 12px 20px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Meu Catálogo</h1>
  </header>

  <main class="catalogo">

    <div class="filme">
      <h2>Meu teste</h2>

      <p>🎬 Esporte • 2026</p>

      <p>
        Vídeo de teste do nosso catálogo.
      </p>

      <a class="botao" href="#">
        ▶ ASSISTIR
      </a>
    </div>

  </main>

</body>
</html>
