<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Catálogo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #222;
    }

    h1 {
      margin: 0;
    }

    .catalogo {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .filme {
      background: #222;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .filme h2 {
      margin-top: 0;
    }

    .botao {
      display: inline-block;
      padding: 12px 20px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .botao:hover {
      background: #b20710;
    }

    #player {
      display: none;
      margin-top: 20px;
    }

    video {
      width: 100%;
      max-width: 700px;
      border-radius: 12px;
      background: black;
    }

    .fechar {
      background: #555;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Meu Catálogo</h1>
  </header>

  <main class="catalogo">

    <div class="filme">

      <h2>Meu teste</h2>

      <p>🎬 Esporte • 2026</p>

      <p>
        Vídeo de teste do nosso catálogo.
      </p>

      <button class="botao" onclick="abrirVideo()">
        ▶ ASSISTIR
      </button>

      <div id="player">

        <video id="video" controls playsinline>
          <source
            src="https://github.com/davidsoncasadodemelo-stack/Meu-teste-/releases/download/A%C3%A7%C3%A3o/VID-20260920-WA0020.mp4"
            type="video/mp4">
          
          Seu navegador não consegue reproduzir este vídeo.
        </video>

        <br>

        <button class="botao fechar" onclick="fecharVideo()">
          ✖ FECHAR VÍDEO
        </button>

      </div>

    </div>

  </main>

  <script>

    function abrirVideo() {
      document.getElementById("player").style.display = "block";

      const video = document.getElementById("video");

      video.play().catch(function() {
        console.log("O navegador bloqueou a reprodução automática.");
      });
    }

    function fecharVideo() {
      const video = document.getElementById("video");

      video.pause();
      video.currentTime = 0;

      document.getElementById("player").style.display = "none";
    }

  </script>

</body>
</html>
